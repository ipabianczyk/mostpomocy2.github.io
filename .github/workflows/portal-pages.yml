name: Publish MostPomocy 2 test Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/portal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mostpomocy2-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portal
        run: npm test
      - name: Isolate test URLs before building
        run: |
          node --input-type=module <<'EOF'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='site/content/site.json';
          const data=JSON.parse(await readFile(path,'utf8'));
          data.settings.siteUrl='https://mostpomocy2-test.pages.dev';
          data.settings.adminUrl='https://mostpomocy2-dashboard-test.pabigor.workers.dev/admin/';
          await writeFile(path,JSON.stringify(data,null,2));
          EOF
      - name: Build test site
        run: npm run build
      - name: Guard against production-domain binding
        run: |
          test ! -e dist/CNAME
          test -f dist/index.html
          test -f dist/content/public.json
          ! grep -R 'rel="canonical" href="https://mostpomocy.pl' dist --include='*.html'
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish test Pages."
            exit 1
          fi
      - name: Publish only to mostpomocy2-test
        run: npx --yes wrangler@3 pages deploy dist --project-name=mostpomocy2-test --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
