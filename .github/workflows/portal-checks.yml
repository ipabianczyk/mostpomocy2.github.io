name: Portal checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Build static portal
        run: npm run build
      - name: Verify main generated pages
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/admin/index.html
          test -f dist/content/public.json
